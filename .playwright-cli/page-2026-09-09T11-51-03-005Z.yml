    - heading "CSS" [level=3] [ref=e108]
    - paragraph [ref=e109]: All sizing of items is handled by your CSS.
    - code [ref=e111]: ".grid-item { width: 200px; } .grid-item--width2 { width: 400px; }"
    - heading "Initialize with jQuery" [level=3] [ref=e112]
    - paragraph [ref=e113]:
      - text: "You can use Masonry as a jQuery plugin:"
      - code [ref=e114]: $('selector').masonry()
      - text: .
    - code [ref=e116]: "$('.grid').masonry({ // options itemSelector: '.grid-item', columnWidth: 200 });"
    - heading "Initialize with Vanilla JavaScript" [level=3] [ref=e117]
    - paragraph [ref=e118]:
      - text: "You can use Masonry with vanilla JS:"
      - code [ref=e119]: new Masonry( elem, options )
      - text: . The
      - code [ref=e120]: Masonry()
      - text: "constructor accepts two arguments: the container element and an options object."
    - code [ref=e122]: "var elem = document.querySelector('.grid'); var msnry = new Masonry( elem, { // options itemSelector: '.grid-item', columnWidth: 200 }); // element argument can be a selector string // for an individual element var msnry = new Masonry( '.grid', { // options });"
    - heading "Initialize in HTML" [level=3] [ref=e123]
    - paragraph [ref=e124]:
      - text: You can initialize Masonry in HTML, without writing any JavaScript. Add
      - code [ref=e125]: data-masonry
      - text: attribute to the container element.
      - link "Options" [ref=e126] [cursor=pointer]:
        - /url: /options
      - text: can be set in its value.
    - code [ref=e128]:
      - generic [ref=e129]: "<div class=\"grid\" data-masonry='{ \"itemSelector\": \".grid-item\", \"columnWidth\": 200 }'>"
    - paragraph [ref=e130]:
      - link "Edit this demo on CodePen" [ref=e131] [cursor=pointer]:
        - /url: https://codepen.io/desandro/pen/vLeBLV
    - generic [ref=e132]:
      - text: i
      - paragraph [ref=e133]:
        - text: Options set in HTML must be valid JSON. Keys need to be quoted, for example
        - code [ref=e134]: "\"itemSelector\":"
        - text: . Note the value of
        - code [ref=e135]: data-masonry
        - text: is set with single quotes
        - code [ref=e136]: "'"
        - text: ", but JSON entities use double-quotes"
        - code [ref=e137]: "\""
        - text: .
    - paragraph [ref=e138]:
      - text: HTML initialization was previously done with a class of
      - code [ref=e139]: js-masonry
      - text: and setting options in
      - code [ref=e140]: data-masonry-options
      - text: in Masonry v3. Masonry v4 is backwards compatible with this code.
    - code [ref=e142]:
      - generic [ref=e143]: "<div class=\"grid js-masonry\" data-masonry-options='{ \"itemSelector\": \".grid-item\", \"columnWidth\": 200 }'>"
