    - paragraph [ref=e97]: Masonry works on a container grid element with a group of child items.
    - code [ref=e99]:
      - generic [ref=e100]: <div class="grid">
      - generic [ref=e101]: <div class="grid-item">
      - text: ...
      - generic [ref=e102]: </div>
      - generic [ref=e103]: <div class="grid-item grid-item--width2">
      - text: ...
      - generic [ref=e104]: </div>
      - generic [ref=e105]: <div class="grid-item">
