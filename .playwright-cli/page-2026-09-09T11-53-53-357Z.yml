      - heading "Removed features from the core" [level=4] [ref=e84]
      - paragraph [ref=e85]: "Some built-in features were removed in v5, either because they are using outdated technology or just rarely used. Some of them are or will be replaced by a plugin. These include:"
      - list [ref=e86]:
        - listitem [ref=e87]: History API (#hash-based navigation is outdated)
        - listitem [ref=e88]: Social sharing (unreliable URL, lack of Opengraph support)
        - listitem [ref=e89]:
          - text: Fullscreen button (rarely used, double fullscreen).
          - link "Related example in docs →" [ref=e90] [cursor=pointer]:
            - /url: /native-fullscreen-on-open
        - listitem [ref=e91]:
          - text: Caption (accessibility problems). Refer to the
          - link "caption section of docs" [ref=e92] [cursor=pointer]:
            - /url: /caption
          - text: .
        - listitem [ref=e93]: Inline gallery support (v5 is mainly designed to be used as a dialog).
      - heading "Plugins" [level=2] [ref=e94]
      - heading [level=4] [ref=e95]:
        - link "Dynamic Caption plugin" [ref=e96] [cursor=pointer]:
          - /url: https://github.com/dimsemenov/photoswipe-dynamic-caption-plugin
      - paragraph [ref=e97]: A plugin that dynamically positions the caption below or aside depending on the available free space.
