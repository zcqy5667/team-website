    - generic [ref=e48]:
      - heading "What’s new in v5" [level=2] [ref=e49]
      - heading "Code quality and rewrite in ES6" [level=4] [ref=e50]
      - paragraph [ref=e51]:
        - text: The script is now distributed as an ES module and does not require a build step to use.
        - link "The documentation" [ref=e52] [cursor=pointer]:
          - /url: /getting-started
        - text: is also updated and now includes more examples.
      - heading "Simpler initialization and dynamic import support" [level=4] [ref=e53]
      - paragraph [ref=e54]: PhotoSwipe now supports dynamic import and does not block page rendering.
      - code [ref=e58]:
        - generic [ref=e59]: <script type="module">
        - generic [ref=e60]: import Lightbox from './photoswipe-lightbox.esm.js';
        - generic [ref=e61]: "const lightbox = new Lightbox({"
        - generic [ref=e62]: "gallery: '#my-gallery',"
        - generic [ref=e63]: "children: 'a',"
        - generic [ref=e64]: "pswpModule: () => import('./photoswipe.esm.js')"
        - generic [ref=e65]: "});"
        - generic [ref=e66]: lightbox.init();
        - generic [ref=e67]: </script>
      - heading "Animation and gesture engine update" [level=4] [ref=e68]
      - paragraph [ref=e69]:
        - text: Improved performance of most animations, touch gestures should feel more fluid now. The initial opening or closing
        - link "transition can be run from a CSS-cropped thumbnail" [ref=e70] [cursor=pointer]:
          - /url: /opening-or-closing-transition#animating-from-cropped-thumbnail
        - text: ", as you can see on the top of this page."
      - heading "Single CSS file and no external assets" [level=4] [ref=e71]
      - paragraph [ref=e72]:
        - text: Using CSS variables, default icons are dynamically generated and tiny.
        - link "Styling guide →" [ref=e73] [cursor=pointer]:
          - /url: /styling
      - heading "Built-in responsive images support" [level=4] [ref=e74]
      - paragraph [ref=e75]: PhotoSwipe also dynamically loads larger images as a user zooms via srcset.
      - heading "Open images in a zoomed state" [level=4] [ref=e76]
      - paragraph [ref=e77]:
        - text: It's now much easier to control zoom level, refer to the
        - link "Adjusting Zoom Level" [ref=e78] [cursor=pointer]:
          - /url: /adjusting-zoom-level
        - text: section of docs for more info. The example below opens images in a zoomed state and individually.
