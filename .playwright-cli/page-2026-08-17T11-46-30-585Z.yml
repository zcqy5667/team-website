          - heading "硬件组职责" [level=2] [ref=f2e27]
          - paragraph [ref=f2e28]: 硬件组承担机器人电路板的设计、实现与调试工作，将机器人的构想从理论概念转化为实体设备。所有软件算法与控制代码，都需要依托硬件平台，才能在物理环境中完成实际运行。 组内工作覆盖完整的硬件开发链路：包含需求拆解、器件选型、电路方案设计、电路与电磁场仿真、PCB 版图绘制，同时兼顾生产工艺约束、成本与性能之间的权衡，结合实际工况完成参数核算，输出可落地的硬件方案。此外硬件组不仅需要设计PCB，还需具备相应的编程能力。 硬件开发充满工程层面的现实考验，开发调试过程中会遇到器件烧毁、功率器件异常、布线缺陷、结构尺寸不匹配等各类实际问题。如果说代码定义了机器人性能能够抵达的上限，硬件则构筑起整机可靠工作的现实根基。 在这里围绕机器人项目开展完整工程实践，将理论知识落地为真实电路，在不断排错、迭代、优化的过程中积累电路设计、调试排障的实操能力，理解实际项目中的取舍与权衡。
